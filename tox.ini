[tox]
envlist = py39, py310, py311, py312, py313

[testenv]
commands = pytest {posargs}
deps = -r{toxinidir}/requirements_test.txt

[flake8]
# W605 behaviour is changed since 3.6
ignore = C901, W605, E501
import-order-style = google
exclude =
    .git,
    .tox,
    __pycache__,
    docs/source/conf.py,
    setup.py,
    old,
    build,
    dist
max-complexity = 10

[testenv:pep8]
deps = -r{toxinidir}/requirements_test.txt
commands =
  flake8 {posargs}